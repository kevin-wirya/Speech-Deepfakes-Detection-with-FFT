services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      INITIALIZE_DETECTOR_ON_IMPORT: "1"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
